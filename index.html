<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aly W</title>
<meta name="description" content="Aly W, product designer. Design systems, enterprise and data-dense products UX, AI/ML tooling.">
<meta property="og:title" content="Aly W">
<meta property="og:description" content="Product designer. Design systems, enterprise and data-dense products, AI/ML tooling.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://alywheale.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000000;
    --paper: #ffffff;
    --marker: #ffc60b;
    --marker-2: #ffb300;
    --pad-left: clamp(24px, 21vw, 420px);
    --pad-top: clamp(40px, 7vh, 90px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    padding: var(--pad-top) 24px 64px var(--pad-left);
  }

  h1 {
    margin: 0 0 clamp(28px, 4vh, 52px) 0;
    font-size: clamp(44px, 6.4vw, 88px);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.015em;
  }

  h1 span {
    display: inline-block;
    background: var(--ink);
    color: var(--paper);
    padding: 0.09em 0.10em 0.13em;
  }

  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(16px, 2.4vh, 30px);
  }

  nav a {
    display: inline-block;
    background: var(--marker);
    color: var(--ink);
    text-decoration: none;
    font-size: clamp(22px, 2.9vw, 40px);
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -0.01em;
    padding: 0.06em 0.14em 0.10em;
    transition: background 120ms ease, transform 120ms ease;
  }

  nav a:hover,
  nav a:focus-visible {
    background: var(--marker-2);
    transform: translateX(3px);
  }

  nav a:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    nav a { transition: none; }
    nav a:hover, nav a:focus-visible { transform: none; }
  }
</style>
</head>

<body>
  <h1><span>Aly&nbsp;W.</span></h1>

  <nav aria-label="Main">
    <ul>
      <li><a href="cv.pdf">CV</a></li>
      <li><a href="projects.pdf">Projects</a></li>
      <li><a href="mailto:alywheale@gmail.com">Email</a></li>
    </ul>
  </nav>
</body>
</html>
